server {
    listen 80;
    listen [::]:80;
    server_name grok.lens4web.com;
    expires off;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/grok-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://grok.lens4web.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grok.lens4web.com;
    ssl_certificate /etc/letsencrypt/live/grok.lens4web.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grok.lens4web.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 75m;
    expires off;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/grok.access.log;
    error_log /var/log/nginx/grok.error.log;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header X-Content-Type-Options;
    }
}
