server {
    listen 80;
    listen [::]:80;
    server_name grok.lens4web.com;
    expires off;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/grok-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
